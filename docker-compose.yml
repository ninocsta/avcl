# Compose do Coolify (build pack "Docker Compose"). Postgres e Redis são
# recursos compartilhados do Coolify: marcar "Connect to Predefined Network".
# Variáveis vêm do painel; `${VAR:?}` = deploy falha se faltar.
x-django: &django
  build: .
  restart: unless-stopped
  init: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  environment:
    TZ: America/Sao_Paulo
    DEBUG: "False"
    SECRET_KEY: ${SECRET_KEY:?}
    # Sem esquema, e TERMINANDO em `,localhost`: o healthcheck bate em
    # localhost de dentro do container (senão 400 DisallowedHost = unhealthy).
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:?}
    # Com esquema: https://avcl.costatech.dev
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?}
    DATABASE_URL: ${DATABASE_URL:?}
    # Broker e result backend do Celery. O índice do DB vem na URL (avcl = /0).
    REDIS_URL: ${REDIS_URL:?}
    GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}

services:
  # CMD da imagem: migrate + gunicorn. Só o web migra.
  web:
    <<: *django
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  worker:
    <<: *django
    command: celery -A app worker -l info --concurrency=1
    # web healthy = migrations aplicadas.
    depends_on:
      web:
        condition: service_healthy
    # Pergunta ao worker DESTE container (-d), não a qualquer um da fila.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app inspect ping -d celery@$$HOSTNAME -t 10"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s

  # Agenda no banco (django_celery_beat DatabaseScheduler): sem volume.
  # Uma réplica só, senão as tarefas disparam em dobro.
  beat:
    <<: *django
    command: celery -A app beat -l info --pidfile /tmp/celerybeat.pid
    # web healthy = migrations aplicadas.
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(int(open('/tmp/celerybeat.pid').read()), 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
