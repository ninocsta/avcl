# Compose do Coolify (build pack "Docker Compose"). Postgres é recurso
# compartilhado do Coolify: marcar "Connect to Predefined Network".
# Variáveis vêm do painel; `${VAR:?}` = deploy falha se faltar.
x-django: &django
  build: .
  restart: unless-stopped
  init: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  environment:
    TZ: America/Sao_Paulo
    DEBUG: "False"
    SECRET_KEY: ${SECRET_KEY:?}
    # Sem esquema, e TERMINANDO em `,localhost`: o healthcheck bate em
    # localhost de dentro do container (senão 400 DisallowedHost = unhealthy).
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:?}
    # Com esquema: https://avcl.costatech.dev
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?}
    DATABASE_URL: ${DATABASE_URL:?}
    GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
    # Bot Telegram global (Team Shared Variables); vazio = sem avisos.
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    TELEGRAM_THREAD_ID: ${TELEGRAM_THREAD_ID:-}

services:
  # CMD da imagem: migrate + gunicorn. Sem worker/beat: a mensalidade do mês
  # roda como Scheduled Task do Coolify neste container (ver README).
  web:
    <<: *django
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=4)"]
      # ponytail: 60s p/ poupar CPU (cada check sobe um processo); start_interval acelera a subida.
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s

